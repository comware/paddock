<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="t d">
  <title id="t">Chia mucilage compared with mould</title>
  <desc id="d">Left: chia seeds each surrounded by a clear even gel halo. Right: seeds with patchy grey fuzzy mould clustered between them.</desc>
  <!-- Self-contained light card: the app toggles dark mode with a class on <html>, which an
       img-loaded SVG cannot see, so the figure carries its own ground and ink. -->
  <rect width="640" height="330" rx="10" fill="#f8fafc"/>
  <rect x="0.5" y="0.5" width="639" height="329" rx="10" fill="none" stroke="#cbd5e1"/>
  <line x1="320" y1="16" x2="320" y2="286" stroke="#e2e8f0"/>
  <g font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
    <text x="24" y="36" font-size="15" font-weight="600" fill="#15803d">Mucilage - normal</text>
    <text x="344" y="36" font-size="15" font-weight="600" fill="#b45309">Mould - act now</text>
    <text x="24" y="60" font-size="12" fill="#334155">Clear and glassy, not white</text><text x="24" y="78" font-size="12" fill="#334155">An even halo around every seed</text><text x="24" y="96" font-size="12" fill="#334155">Appears within minutes of watering</text><text x="24" y="114" font-size="12" fill="#334155">Smooth, and odourless</text><text x="344" y="60" font-size="12" fill="#334155">Grey or off-white, never clear</text><text x="344" y="78" font-size="12" fill="#334155">Clustered in patches, skipping seeds</text><text x="344" y="96" font-size="12" fill="#334155">Appears days in, not minutes</text><text x="344" y="114" font-size="12" fill="#334155">Fuzzy, with a musty smell</text>
  </g>
