<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="t d">
  <title id="t">Healthy stems compared with leggy stems</title>
  <desc id="d">Left: short thick uniform stems with large seed leaves. Right: tall thin pale stems of uneven height leaning in different directions with small leaves.</desc>
  <!-- Self-contained light card: the app toggles dark mode with a class on <html>, which an
       img-loaded SVG cannot see, so the figure carries its own ground and ink. -->
  <rect width="640" height="330" rx="10" fill="#f8fafc"/>
  <rect x="0.5" y="0.5" width="639" height="329" rx="10" fill="none" stroke="#cbd5e1"/>
  <line x1="320" y1="16" x2="320" y2="286" stroke="#e2e8f0"/>
  <g font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
    <text x="24" y="36" font-size="15" font-weight="600" fill="#15803d">Healthy</text>
    <text x="344" y="36" font-size="15" font-weight="600" fill="#b45309">Leggy - too little light</text>
    <text x="24" y="60" font-size="12" fill="#334155">Short and thick for the crop's stage</text><text x="24" y="78" font-size="12" fill="#334155">Even height across the tray</text><text x="24" y="96" font-size="12" fill="#334155">Deep colour, large seed leaves</text><text x="24" y="114" font-size="12" fill="#334155">Stands up on its own</text><text x="344" y="60" font-size="12" fill="#334155">Tall, thin, and weak</text><text x="344" y="78" font-size="12" fill="#334155">Uneven - leaning in all directions</text><text x="344" y="96" font-size="12" fill="#334155">Pale, washed-out colour</text><text x="344" y="114" font-size="12" fill="#334155">Collapses under its own weight</text>
  </g>
