  <g font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><text x="24" y="311" font-size="12.5" fill="#475569">Pale and stretched means not enough light, or too long in blackout. It is never too much light.</text></g>
</svg>
