<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="t d">
  <title id="t">Cotyledons compared with true leaves</title>
  <desc id="d">Left: seedlings with a single pair of smooth rounded seed leaves. Right: the same seedlings with a jagged true leaf emerging from the centre above the seed leaves.</desc>
  <!-- Self-contained light card: the app toggles dark mode with a class on <html>, which an
       img-loaded SVG cannot see, so the figure carries its own ground and ink. -->
  <rect width="640" height="330" rx="10" fill="#f8fafc"/>
  <rect x="0.5" y="0.5" width="639" height="329" rx="10" fill="none" stroke="#cbd5e1"/>
  <line x1="320" y1="16" x2="320" y2="286" stroke="#e2e8f0"/>
  <g font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
    <text x="24" y="36" font-size="15" font-weight="600" fill="#15803d">Cotyledons - harvest now</text>
    <text x="344" y="36" font-size="15" font-weight="600" fill="#b45309">True leaves - window missed</text>
    <text x="24" y="60" font-size="12" fill="#334155">One pair of smooth, rounded seed leaves</text><text x="24" y="78" font-size="12" fill="#334155">Nothing emerging from the centre</text><text x="24" y="96" font-size="12" fill="#334155">Tender stems, best flavour</text><text x="24" y="114" font-size="12" fill="#334155">This is the harvest window</text><text x="344" y="60" font-size="12" fill="#334155">A jagged leaf rising from the centre</text><text x="344" y="78" font-size="12" fill="#334155">Stems toughening</text><text x="344" y="96" font-size="12" fill="#334155">Flavour coarsens; brassicas turn sharp</text><text x="344" y="114" font-size="12" fill="#334155">Still edible, past its best</text>
  </g>
  <rect x="40" y="246" width="240" height="28" rx="3" fill="#e7e5e4"/><path d="M90 246 L 90 176" stroke="#65a30d" stroke-width="3.2" stroke-linecap="round"/><ellipse cx="77" cy="172" rx="15" ry="8" fill="#84cc16" transform="rotate(-20 77 172)"/><ellipse cx="103" cy="172" rx="15" ry="8" fill="#84cc16" transform="rotate(20 103 172)"/><path d="M160 246 L 160 176" stroke="#65a30d" stroke-width="3.2" stroke-linecap="round"/><ellipse cx="147" cy="172" rx="15" ry="8" fill="#84cc16" transform="rotate(-20 147 172)"/><ellipse cx="173" cy="172" rx="15" ry="8" fill="#84cc16" transform="rotate(20 173 172)"/><path d="M230 246 L 230 176" stroke="#65a30d" stroke-width="3.2" stroke-linecap="round"/><ellipse cx="217" cy="172" rx="15" ry="8" fill="#84cc16" transform="rotate(-20 217 172)"/><ellipse cx="243" cy="172" rx="15" ry="8" fill="#84cc16" transform="rotate(20 243 172)"/>
  <rect x="360" y="246" width="240" height="28" rx="3" fill="#e7e5e4"/><path d="M410 246 L 410 176" stroke="#65a30d" stroke-width="3.2" stroke-linecap="round"/><ellipse cx="397" cy="172" rx="15" ry="8" fill="#84cc16" transform="rotate(-20 397 172)"/><ellipse cx="423" cy="172" rx="15" ry="8" fill="#84cc16" transform="rotate(20 423 172)"/><path d="M410 168 c -9 -13 -4 -26 0 -30 c 4 4 9 17 0 30 z" fill="#4d7c0f"/><path d="M399 162 c -10 -6 -13 -16 -12 -20 c 5 1 14 8 12 20 z" fill="#4d7c0f"/><path d="M421 162 c 10 -6 13 -16 12 -20 c -5 1 -14 8 -12 20 z" fill="#4d7c0f"/><path d="M480 246 L 480 176" stroke="#65a30d" stroke-width="3.2" stroke-linecap="round"/><ellipse cx="467" cy="172" rx="15" ry="8" fill="#84cc16" transform="rotate(-20 467 172)"/><ellipse cx="493" cy="172" rx="15" ry="8" fill="#84cc16" transform="rotate(20 493 172)"/><path d="M480 168 c -9 -13 -4 -26 0 -30 c 4 4 9 17 0 30 z" fill="#4d7c0f"/><path d="M469 162 c -10 -6 -13 -16 -12 -20 c 5 1 14 8 12 20 z" fill="#4d7c0f"/><path d="M491 162 c 10 -6 13 -16 12 -20 c -5 1 -14 8 -12 20 z" fill="#4d7c0f"/><path d="M550 246 L 550 176" stroke="#65a30d" stroke-width="3.2" stroke-linecap="round"/><ellipse cx="537" cy="172" rx="15" ry="8" fill="#84cc16" transform="rotate(-20 537 172)"/><ellipse cx="563" cy="172" rx="15" ry="8" fill="#84cc16" transform="rotate(20 563 172)"/><path d="M550 168 c -9 -13 -4 -26 0 -30 c 4 4 9 17 0 30 z" fill="#4d7c0f"/><path d="M539 162 c -10 -6 -13 -16 -12 -20 c 5 1 14 8 12 20 z" fill="#4d7c0f"/><path d="M561 162 c 10 -6 13 -16 12 -20 c -5 1 -14 8 -12 20 z" fill="#4d7c0f"/>
  <g font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><text x="24" y="311" font-size="12.5" fill="#475569">Cut when the seed leaves are open and flat. The first true leaf means you are late.</text></g>
</svg>
