name: "Performance — Bundle Splitting"
description: |
  Split the 1.8MB main JS bundle by moving route children inside lazy boundaries
  and isolating react-big-calendar. Currently routes.tsx statically imports
  growRoutes/propagationRoutes/plannerRoutes which pull all components into
  the main chunk despite lazy() on module entry points.

