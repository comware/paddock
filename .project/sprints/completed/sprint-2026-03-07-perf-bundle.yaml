handoffs:
  - id: "pb-001-lazy-routes"
    title: "Move Route Children Inside Lazy Boundaries"
    priority: P0
    estimate_hours: 1
    description: |
      The root cause of the 1.8MB bundle: src/routes.tsx statically imports
      growRoutes, propagationRoutes, plannerRoutes — which statically import
      ALL components. Even though lazy() wraps module entry points, the child
      route imports defeat code splitting.

      Fix approach:
      1. Remove static imports of growRoutes, propagationRoutes, plannerRoutes
         from src/routes.tsx
      2. Move the children route arrays INTO each module's index.tsx (the lazy
         entry point). Each module index should export a component that renders
         <Routes> or uses <Outlet> with its own children.
      3. In routes.tsx, use path: 'grow/*' with just the lazy module element
         (no children prop). The module handles its own sub-routing internally.

      Alternative simpler approach:
      1. Keep route structure in routes.tsx
      2. But lazy-load each route component individually using React.lazy()
      3. Replace static imports in grow/routes.tsx, propagation/routes.tsx,
         planner/routes.tsx with lazy(() => import('./components/...'))

      Choose whichever approach is cleaner. The key constraint: the static
      import chain from routes.tsx → module/routes.tsx → components must be broken.

      Files to modify:
      - src/routes.tsx (remove static route imports)
      - src/modules/grow/routes.tsx (lazy-load components)
      - src/modules/propagation/routes.tsx (lazy-load components)
      - src/modules/planner/routes.tsx (lazy-load components)
      - Possibly src/modules/grow/index.tsx, propagation/index.tsx, planner/index.tsx
    acceptance_criteria:
      - "No static component imports in route files (verified via: grep -c 'import {' src/modules/grow/routes.tsx src/modules/propagation/routes.tsx src/modules/planner/routes.tsx returns 0 or only type imports)"
      - "Main JS chunk under 500KB (verified via: npm run build 2>&1 | grep 'index-' | awk '{print $1}' shows size < 500)"
      - "All tests pass (verified via: npm test exits 0)"
      - "Build succeeds (verified via: npm run build exits 0)"
    blocked_by: []

  - id: "pb-002-calendar-chunk"
    title: "Isolate react-big-calendar in Separate Chunk"
    priority: P1
    estimate_hours: 0.25
    description: |
      Add react-big-calendar to manualChunks in vite.config.ts to ensure
      it's in its own vendor chunk, not bundled with app code.

      File to modify:
      - vite.config.ts (add to build.rollupOptions.output.manualChunks)

      Add:
        'vendor-calendar': ['react-big-calendar'],

      This keeps the calendar library (~200KB) in its own chunk that only
      loads when the planner module is accessed.
    acceptance_criteria:
      - "react-big-calendar in manualChunks (verified via: grep -c 'react-big-calendar' vite.config.ts returns >= 1)"
      - "Build produces vendor-calendar chunk (verified via: npm run build 2>&1 | grep 'vendor-calendar')"
      - "Build succeeds (verified via: npm run build exits 0)"
    blocked_by: []

  - id: "pb-999-commit-verify"
    title: "Commit and Verify CI"
    priority: P0
    estimate_hours: 0.25
    description: |
      Final sprint handoff - commit, verify, update goals.

      1. Run npm test — verify all tests pass
      2. Run npm run build — verify build passes and main chunk < 500KB
      3. git add relevant files
      4. git commit -m "perf: split 1.8MB bundle via lazy routes and calendar chunk"
      5. DO NOT run git push — the autopilot harness handles remote sync
    acceptance_criteria:
      - "All changes committed (verified via: git status --porcelain shows clean for src/ files)"
      - "Build passes (verified via: npm run build exits 0)"
      - "Tests pass (verified via: npm test exits 0)"
