handoffs:
  - id: "it-001-db-tests"
    title: "Create Database Schema & Operations Tests"
    priority: P0
    estimate_hours: 0.75
    description: |
      Create test file at src/lib/db/__tests__/schema.test.ts with at least 5 tests
      covering the database layer.

      Files to test:
      - src/lib/db/schema.ts — PaddockDB class with 9 schema versions, 21 tables
      - src/lib/db/index.ts — Convenience exports (growDb, platformDb, propDb, plannerDb, aiDb)

      Test areas:
      1. Database instance creation — verify db is a Dexie instance
      2. Table existence — verify all expected tables exist on the db instance
      3. Convenience export structure — verify growDb, platformDb, propDb, plannerDb, aiDb
         have the correct table references
      4. Schema version — verify db.verno matches expected version (9)
      5. Index definitions — verify key indexes exist on critical tables
         (e.g., growTrays has 'variety' index, propBatches has compound indexes)

      Pattern: Use vitest (import { describe, it, expect } from 'vitest').
      The db is a Dexie instance — you can inspect its tables and schema without
      actually opening IndexedDB (Dexie exposes .tables, .verno, etc.).

      IMPORTANT: Do NOT change any production code. Test-only additions.
    acceptance_criteria:
      - "Test file exists at src/lib/db/__tests__/schema.test.ts (verified via: test -f src/lib/db/__tests__/schema.test.ts && echo EXISTS)"
      - "At least 5 tests defined (verified via: grep -c 'it(' src/lib/db/__tests__/schema.test.ts shows >= 5)"
      - "Tests pass (verified via: pnpm vitest run src/lib/db/__tests__/schema.test.ts exits 0)"
    blocked_by: []

  - id: "it-002-ai-service-tests"
    title: "Create AI Service Tests"
    priority: P0
    estimate_hours: 0.75
    description: |
      Create test file at src/lib/ai/__tests__/service.test.ts with at least 5 tests
      covering the AIService class.

      File to test:
      - src/lib/ai/service.ts — AIService class (209 LOC)
        Methods: getAllModels, getProvider, getProviderForModel, getConfiguredProviders,
        getAvailableModels, saveApiKey, getApiKeyMasked, deleteApiKey, validateApiKey,
        chat, chatStream

      Test areas:
      1. getAllModels — returns array of supported models
      2. getProvider — returns correct provider for 'openai', 'anthropic', 'gemini'
      3. getProvider — returns undefined for unknown provider
      4. getProviderForModel — returns correct provider for known model ID
      5. getProviderForModel — returns undefined for unknown model ID
      6. chat — throws error when model not found
      7. chatStream — calls onError when model not found

      Pattern: Use vitest. Mock Dexie/IndexedDB interactions using vi.mock().
      The AI providers use fetch internally — mock at the provider level, not fetch.
      Focus on the service orchestration logic, not the provider implementations.

      IMPORTANT: Do NOT change any production code. Test-only additions.
    acceptance_criteria:
      - "Test file exists at src/lib/ai/__tests__/service.test.ts (verified via: test -f src/lib/ai/__tests__/service.test.ts && echo EXISTS)"
      - "At least 5 tests defined (verified via: grep -c 'it(' src/lib/ai/__tests__/service.test.ts shows >= 5)"
      - "Tests pass (verified via: pnpm vitest run src/lib/ai/__tests__/service.test.ts exits 0)"
    blocked_by: []

  - id: "it-003-update-deps"
    title: "Update Dependencies to Fix CVEs"
    priority: P1
    estimate_hours: 0.25
    description: |
      Update react-router-dom and vite-plugin-pwa to fix known CVEs.

      Current versions (from package.json):
      - react-router-dom: "^7.11.0" → update to "^7.13.1" or higher
      - vite-plugin-pwa: "^1.2.0" → update to latest (fixes workbox CVEs)

      Steps:
      1. Run: pnpm update react-router-dom --latest
      2. Run: pnpm update vite-plugin-pwa --latest
      3. Run: pnpm run build — verify no breaking changes
      4. Run: pnpm vitest run — verify all tests pass

      If build breaks after update:
      - Check react-router-dom migration guide for breaking changes
      - The codebase uses useRoutes() and lazy() — these are stable APIs
      - Fix any type errors or API changes

      IMPORTANT: Only update the two specified packages. Do NOT update other deps.
    acceptance_criteria:
      - "react-router-dom >= 7.13.1 (verified via: node -e \"console.log(require('./node_modules/react-router-dom/package.json').version)\" shows >= 7.13.1)"
      - "vite-plugin-pwa updated (verified via: node -e \"console.log(require('./node_modules/vite-plugin-pwa/package.json').version)\" shows newer than 1.2.0)"
      - "Build succeeds (verified via: pnpm run build exits 0)"
      - "All tests pass (verified via: pnpm vitest run exits 0)"
    blocked_by: []

  - id: "it-999-commit-verify"
    title: "Commit and Verify CI"
    priority: P0
    estimate_hours: 0.25
    description: |
      Final sprint handoff - commit, verify, update goals.

      1. Run pnpm vitest run — verify all tests pass
      2. Run pnpm run build — verify build passes
      3. git add relevant files (new test files + updated package.json + pnpm-lock.yaml)
      4. git commit -m "test(infra): add db and ai service tests, update deps for CVE fixes"
      5. DO NOT run git push — the autopilot harness handles remote sync
    acceptance_criteria:
      - "All changes committed (verified via: git status --porcelain shows clean for src/ and package files)"
      - "Build passes (verified via: pnpm run build exits 0)"
      - "Tests pass (verified via: pnpm vitest run exits 0)"
