handoffs:
  - id: "sh-001-crypto-fix"
    title: "Fix CryptoKey to Non-Extractable"
    priority: P0
    estimate_hours: 0.25
    description: |
      In src/lib/ai/crypto.ts, the CryptoKey is created with extractable: true
      and the raw key material is stored in localStorage. This means any XSS can
      read the key and decrypt all API keys.

      Fix approach:
      1. Change generateKey to use extractable: false
      2. Remove the localStorage export/import of raw key material
      3. Store the CryptoKey in IndexedDB instead (non-extractable keys can be
         stored via structured clone in IDB but NOT exported to raw bytes)
      4. If the key is lost (IDB cleared), generate a new one — users will need
         to re-enter API keys (acceptable trade-off for security)
      5. Update getCryptoKey() to read from IDB instead of localStorage
      6. Keep backward compat: if old localStorage key exists, import it once
         into IDB as non-extractable, then delete from localStorage

      Files:
      - MODIFY: src/lib/ai/crypto.ts
      - May need a small Dexie table or use platformDb for key storage
    acceptance_criteria:
      - "CryptoKey generated with extractable: false (verified via: grep 'extractable.*false' src/lib/ai/crypto.ts)"
      - "No raw key material in localStorage (verified via: grep -c 'localStorage' src/lib/ai/crypto.ts shows 0 or only migration code)"
      - "Encrypt/decrypt still works (verified via: pnpm vitest run exits 0)"
      - "Build succeeds (verified via: pnpm run build exits 0)"
    blocked_by: []

  - id: "sh-002-export-filter"
    title: "Filter API Keys from Recovery Export"
    priority: P0
    estimate_hours: 0.25
    description: |
      In src/lib/errorRecovery.ts:237, exportDataForRecovery() dumps all
      platformDb.settings including encrypted API keys. If a user shares the
      backup for debugging, keys are exposed (especially combined with the
      old localStorage key).

      Fix:
      1. In exportDataForRecovery(), filter the settings array to exclude
         entries where the key matches ai_api_key_* or similar patterns
      2. Alternative: mask the values (replace with "[REDACTED]") instead of
         removing entirely, so the export shows keys exist but not their values

      Files:
      - MODIFY: src/lib/errorRecovery.ts (around line 237)
    acceptance_criteria:
      - "Settings export filters API key entries (verified via: grep -A5 'settings.*toArray' src/lib/errorRecovery.ts | grep -i 'filter\\|api_key\\|REDACTED')"
      - "Build succeeds (verified via: pnpm run build exits 0)"
    blocked_by: []

  - id: "sh-003-csp-header"
    title: "Add Content-Security-Policy Meta Tag"
    priority: P1
    estimate_hours: 0.25
    description: |
      No CSP is configured. Add a meta tag to index.html with a reasonable
      default policy for a local-first PWA:

      1. Add <meta http-equiv="Content-Security-Policy" content="..."> to index.html
      2. Policy should:
         - default-src 'self'
         - script-src 'self' (no inline scripts if possible, or 'unsafe-inline' if Vite requires it)
         - style-src 'self' 'unsafe-inline' (MUI/emotion requires inline styles)
         - connect-src 'self' https://generativelanguage.googleapis.com https://api.openai.com https://api.anthropic.com (AI API endpoints)
         - img-src 'self' data: blob:
         - font-src 'self'
      3. Test that the app still works with CSP enabled
      4. If Vite dev server breaks, add a note that CSP is production-only
         (Vite injects inline scripts in dev mode)

      Files:
      - MODIFY: index.html
    acceptance_criteria:
      - "CSP meta tag exists in index.html (verified via: grep 'Content-Security-Policy' index.html)"
      - "Build succeeds (verified via: pnpm run build exits 0)"
