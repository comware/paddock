id: sprint-2026-03-30-fix-cves
name: "Fix npm CVEs & Update Dependencies"
project: paddock
status: completed

created: 2026-03-30
target_start: 2026-03-30
target_end: 2026-03-31

goal_id: goal-14

goal: |
  Eliminate all HIGH/critical npm audit vulnerabilities and update outdated dependencies.
  Exit criteria: npm audit shows 0 high/critical, vite-plugin-pwa at latest, all tests pass.

context: |
  10 HIGH CVEs traced to vite-plugin-pwa -> workbox -> serialize-javascript chain.
  28 outdated packages total. Major bumps available for vite, typescript, eslint.
  Historical velocity: 5-9 handoffs per sprint. This sprint uses 5 focused handoffs.
  Previous dependency work in goal-10 updated react-router-dom and noted vite-plugin-pwa
  was at 1.2.0 but CVEs persisted in transitive deps.

success_criteria:
  - "Zero high or critical npm audit vulnerabilities (verified via: npm audit --audit-level=high exits 0)"
  - "vite-plugin-pwa updated to latest version (verified via: npm ls vite-plugin-pwa shows >= 0.19.8)"
  - "All tests pass after dependency updates (verified via: npm test exits 0)"

handoffs:
  - id: "CVE-001-update-pwa-plugin"
    title: "Update vite-plugin-pwa to latest (fix all 10 HIGH CVEs)"
    priority: P0
    estimate_hours: 1.5
    status: done
    description: |
      Update vite-plugin-pwa to latest (0.19.8+) which pulls in fixed workbox
      and serialize-javascript versions. This single update should resolve all
      10 HIGH CVEs in the dependency chain.

      Steps:
      1. Run npm outdated to capture current state
      2. npm install vite-plugin-pwa@latest
      3. Run npm audit to verify HIGH CVEs are resolved
      4. Fix any breaking API changes in vite.config.ts or PWA config
      5. Run npm run build to verify compilation
    acceptance_criteria:
      - "vite-plugin-pwa at latest version (verified via: npm ls vite-plugin-pwa)"
      - "npm audit shows 0 high vulnerabilities (verified via: npm audit --audit-level=high)"
      - "Build succeeds (verified via: npm run build exits 0)"
    blocked_by: []

  - id: "CVE-002-audit-fix-remaining"
    title: "Run npm audit fix for remaining moderate vulnerabilities"
    priority: P1
    estimate_hours: 0.5
    status: done
    description: |
      After the vite-plugin-pwa update, run npm audit fix to address any
      remaining moderate or low vulnerabilities that can be auto-resolved.

      Steps:
      1. Run npm audit to see remaining issues
      2. Run npm audit fix (without --force) for safe fixes
      3. Document any remaining advisories that require manual intervention
    acceptance_criteria:
      - "npm audit fix completed (verified via: npm audit shows reduced or zero remaining vulns)"
      - "No new high/critical vulns introduced (verified via: npm audit --audit-level=high exits 0)"
    blocked_by:
      - "CVE-001-update-pwa-plugin"

  - id: "CVE-003-update-major-deps"
    title: "Update major dependencies cautiously (vite, typescript, eslint)"
    priority: P1
    estimate_hours: 2
    status: done
    description: |
      Update major outdated packages one at a time, testing after each.
      Focus on vite, typescript, and eslint which have major version bumps available.

      Steps:
      1. Update vite to latest compatible version, run build + tests
      2. Update typescript if major bump available, fix any new type errors
      3. Update eslint and eslint plugins, fix any new lint warnings
      4. Update remaining outdated packages (minor/patch) in batch
      5. Run full test suite after all updates
    acceptance_criteria:
      - "Major deps updated where possible (verified via: npm outdated shows fewer outdated)"
      - "Build succeeds after updates (verified via: npm run build exits 0)"
      - "Tests pass after updates (verified via: npm test exits 0)"
    blocked_by:
      - "CVE-002-audit-fix-remaining"

  - id: "CVE-004-verify-build-tests"
    title: "Full verification — build, tests, and audit clean"
    priority: P0
    estimate_hours: 0.5
    status: done
    description: |
      Final verification that everything works together after all dependency updates.

      Steps:
      1. Clean node_modules and reinstall: rm -rf node_modules && npm install
      2. Run full build: npm run build
      3. Run full test suite: npm test
      4. Run final audit: npm audit
      5. Verify no regressions in dev server: npm run dev (smoke test)
    acceptance_criteria:
      - "Clean install succeeds (verified via: npm install exits 0)"
      - "Build succeeds (verified via: npm run build exits 0)"
      - "All tests pass (verified via: npm test exits 0)"
      - "Zero high/critical audit vulns (verified via: npm audit --audit-level=high exits 0)"
    blocked_by:
      - "CVE-003-update-major-deps"

  - id: "CVE-999-commit-verify"
    title: "Commit, Verify CI, Update Goal Progress"
    priority: P0
    estimate_hours: 0.5
    status: done
    description: |
      Final sprint handoff: commit all changes, verify CI, and update goal progress.

      This handoff ensures:
      1. All sprint work is committed with proper messages
      2. Changes are pushed to remote
      3. CI pipeline passes (wait for it and fix if needed)
      4. Goal progress is updated in project.yaml

      CI VERIFICATION (MANDATORY after push):
      1. Push changes: git push origin <branch>
      2. Wait for CI to start: sleep 10 && gh run list --limit 1
      3. Watch CI run: gh run watch --exit-status
         - If CI passes: proceed to goal progress update
         - If CI fails: read the failure logs with gh run view --log-failed
         - Fix the failures, commit, push, re-watch
         - Repeat until CI is green

      GOAL PROGRESS UPDATE:
      - Open .project/project.yaml
      - Find goal-14
      - Mark satisfied success_criteria as completed: true
      - Update progress field accordingly
    acceptance_criteria:
      - "All changes committed (verified via: git status --porcelain shows clean)"
      - "Pushed to remote (verified via: git push exits 0)"
      - "CI pipeline passes (verified via: gh run list --limit 1 shows success)"
      - "Tests pass in CI (verified via: npm test exits 0)"
      - "No uncommitted changes remain (verified via: git status --porcelain is empty)"
      - "Goal progress updated (verified via: grep 'progress:' .project/project.yaml shows goal-14 updated)"
    blocked_by:
      - "CVE-004-verify-build-tests"

notes: |
  All 10 HIGH CVEs are in: vite-plugin-pwa -> workbox -> serialize-javascript.
  Updating vite-plugin-pwa to 0.19.8+ should fix all 10 in one shot.
  Be cautious with vite major bump — may require config changes.
  Total estimated hours: 5.0

