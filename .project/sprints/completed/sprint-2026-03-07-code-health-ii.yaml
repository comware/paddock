      5. PropaguleUpdateForm.tsx (560 LOC) — src/modules/propagation/components/Propagules/PropaguleUpdateForm.tsx
         Extract: measurement fields, stage transition section, notes section

      For each component:
      - Read the full file to understand structure
      - Identify logical sections that can be extracted
      - Create sub-component files in the same directory
      - Import and compose in the parent component
      - Ensure the parent file stays under 300 LOC
      - Use the existing shared FormFields.tsx patterns where applicable

      IMPORTANT: Do NOT change any behavior. Pure refactoring only.
