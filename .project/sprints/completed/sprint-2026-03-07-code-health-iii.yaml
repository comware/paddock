sprint:
  id: sprint-2026-03-07-code-health-iii
  name: "Code Health III — Split Large Stores & Utils"
  goal: goal-11
  status: ready
  created: 2026-03-07
  estimated_hours: 2.5
  description: |
    Split 12 remaining source files >500 LOC into focused modules.
    Priority targets: 5 Zustand stores, analyticsCalculations.ts, and types/index.ts.
    Pure refactoring — no behavior changes. All 929 tests must continue to pass.
    Auto-generated by autopilot from cascade findings.
  exit_criteria:
    - "All 5 large store files under 400 LOC each"
    - "analyticsCalculations.ts split into focused modules under 300 LOC each"
    - "propagation/types/index.ts split into domain-specific type files under 300 LOC each"
    - "All 929+ tests pass"
    - "Build succeeds"
  handoffs:
    - id: ch3-001-split-stores
      title: "Split 5 Large Zustand Stores"
      priority: P0
      estimate_hours: 1.5
      description: |
        Split these 5 store files into smaller focused modules:

        1. usePropagules.ts (658 LOC) → split into usePropagules.ts (core CRUD),
           usePropagulesFilters.ts (filtering/sorting), usePropagulesActions.ts (batch actions)
        2. useStations.ts (580 LOC) → split into useStations.ts (core CRUD),
           useStationsCapacity.ts (capacity calculations), useStationsEnvironment.ts (env tracking)
        3. useGraduations.ts (530 LOC) → split into useGraduations.ts (core),
           useGraduationsWorkflow.ts (workflow logic)
        4. useBatches.ts (522 LOC) → split into useBatches.ts (core CRUD),
           useBatchesStages.ts (stage transition logic)
        5. usePlannerStore.ts (557 LOC) → split into usePlannerStore.ts (core),
           usePlannerCalculations.ts (date/schedule calculations)

        Strategy: Extract helper functions, selectors, and action groups into separate files.
        Keep the main store file as the public API that re-exports or composes from sub-modules.
        Update all imports across the codebase to use new paths where needed.

        IMPORTANT: Run `pnpm vitest run` after each store split to catch regressions early.
      acceptance_criteria:
        - "usePropagules.ts under 400 LOC (verified via: wc -l src/modules/propagation/stores/usePropagules.ts shows <400)"
        - "useStations.ts under 400 LOC (verified via: wc -l src/modules/propagation/stores/useStations.ts shows <400)"
        - "useGraduations.ts under 400 LOC (verified via: wc -l src/modules/propagation/stores/useGraduations.ts shows <400)"
        - "useBatches.ts under 400 LOC (verified via: wc -l src/modules/propagation/stores/useBatches.ts shows <400)"
        - "usePlannerStore.ts under 400 LOC (verified via: wc -l src/modules/planner/stores/usePlannerStore.ts shows <400)"
        - "All tests pass (verified via: pnpm vitest run exits 0)"
      blocked_by: []

    - id: ch3-002-split-utils
      title: "Split analyticsCalculations.ts and types/index.ts"
      priority: P0
      estimate_hours: 0.75
      description: |
        Split these 2 large utility/type files:

        1. analyticsCalculations.ts (707 LOC) → split by calculation domain:
           - successRateCalculations.ts (success rate metrics)
           - costCalculations.ts (cost analysis functions)
           - timelineCalculations.ts (timeline/trend analysis)
           - analyticsCalculations.ts (re-exports all, stays as barrel)

        2. types/index.ts (707 LOC) → split by domain:
           - batch-types.ts (batch-related interfaces)
           - station-types.ts (station-related interfaces)
           - propagule-types.ts (propagule-related interfaces)
           - graduation-types.ts (graduation-related interfaces)
           - common-types.ts (shared enums, base interfaces)
           - index.ts (re-exports all, stays as barrel)

        Update all imports across the codebase. The barrel file (index.ts) should
        re-export everything so existing `import { X } from './types'` still works.

        IMPORTANT: Run `pnpm vitest run` after splitting to verify no regressions.
      acceptance_criteria:
        - "analyticsCalculations.ts under 300 LOC or split into sub-modules each under 300 LOC (verified via: wc -l src/modules/propagation/utils/analyticsCalculations.ts shows <300 OR ls src/modules/propagation/utils/*Calculations*.ts shows multiple files)"
        - "types/index.ts under 300 LOC or split into sub-modules each under 300 LOC (verified via: wc -l src/modules/propagation/types/index.ts shows <300 OR ls src/modules/propagation/types/*.ts shows multiple files)"
        - "All tests pass (verified via: pnpm vitest run exits 0)"
        - "Build passes (verified via: pnpm run build exits 0)"
      blocked_by: []

    - id: ch3-999-commit-verify
      title: "Commit and Verify CI"
      priority: P0
      estimate_hours: 0.25
      description: |
        Final sprint handoff - commit, push, verify CI, update goals.

        1. git status - review changes
        2. git add - stage files (avoid secrets)
        3. git commit - descriptive message
        4. git push - push to remote
        5. Verify CI passes (all checks green)
        6. Update goal progress in .claude/project.yaml

        DO NOT mark sprint complete until CI is green.
      acceptance_criteria:
        - "All changes committed (verified via: git status --porcelain shows clean)"
        - "Pushed to remote (verified via: git push exits 0)"
        - "Build passes (verified via: pnpm run build exits 0)"
        - "Tests pass (verified via: pnpm vitest run exits 0)"
        - "Goal progress updated (verified via: grep 'progress:' .claude/project.yaml)"
        - "All prior handoff acceptance criteria pass (verified via: /project:sprint-validate --acceptance exits with verdict PASS)"
      blocked_by: ["ch3-001-split-stores", "ch3-002-split-utils"]
