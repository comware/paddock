description: |
  Combined sprint to complete production stability (80% → 100%) while
  building the foundation for the Planner module (0% → 40-50%).

  Strategic rationale:
  - Stability work hardens existing code before Planner integrates
  - Different skill profiles enable parallel execution
  - Planner is highest-value next module (crop calendar for farming)

  Design decisions:
  - Simple crop calendar first (no succession planting yet)
  - Use react-big-calendar library
  - Integrate with existing Grow trays and Propagation batches

