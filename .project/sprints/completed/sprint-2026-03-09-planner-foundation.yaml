sprint:
  id: sprint-2026-03-09-planner-foundation
  goal: goal-4
  title: "Planner Module Foundation — Event Creation & PRD"
  status: completed
  completed_at: "2026-03-09"
  created: "2026-03-09"
  estimated_hours: 3
  description: |
    Goal-4 infrastructure (store, types, integration hook, calendar) already exists.
    This sprint closes the functional gaps: event creation UI, event list/detail routes,
    and a PRD documenting the module. Updates goal-4 progress to reflect existing work.

  handoffs:
    - id: planner-001-event-create-form
      title: "Add Event Creation Form & Wire Calendar Slot Selection"
      priority: P0
      estimate_hours: 1.5
      description: |
        Create EventCreateForm component for the planner module.
        Wire up PlannerCalendar's handleSelectSlot to open the form with pre-filled date.
        Add /planner/events/new route. Form should support:
        - Title, event type (sow, harvest, water, etc.), scheduled date
        - Site selection, species (optional), notes
        - Linked entity (tray or batch, optional)
        Uses usePlannerStore.createEvent() for persistence.
      tasks:
        - "Create EventCreateForm.tsx in src/modules/planner/components/"
        - "Wire handleSelectSlot in PlannerCalendar to open EventCreateForm with date"
        - "Add route for /planner/events/new in routes.tsx"
        - "Support all PlannerEventType values in event type selector"
        - "Validate required fields (title, eventType, scheduledDate, siteId)"
        - "After create, navigate back to calendar on the event's date"
      acceptance_criteria:
        - "EventCreateForm.tsx exists and renders without errors (verified via: pnpm exec vitest run --reporter verbose 2>&1 | grep -E 'PASS|FAIL')"
        - "Calendar date cell click opens create form with pre-filled date (verified via: grep 'handleSelectSlot' src/modules/planner/components/PlannerCalendar.tsx | grep -v TODO)"
        - "Event creation persists to Dexie via usePlannerStore.createEvent (verified via: grep 'createEvent' src/modules/planner/components/EventCreateForm.tsx)"
        - "Routes include /events/new path (verified via: grep 'events/new' src/modules/planner/routes.tsx)"
        - "Build passes with no TypeScript errors (verified via: pnpm run build exits 0)"
      blocked_by: []

    - id: planner-002-event-list-detail
      title: "Add Event List & Detail Views with Routes"
      priority: P1
      estimate_hours: 1.0
      description: |
        Add the commented-out routes: EventList and EventDetail components.
        EventList: filterable list of all planner events with status badges, type icons.
        EventDetail: single event view with edit/delete/status-change actions.
        Wire up routes in planner routes.tsx.
      tasks:
        - "Create EventList.tsx with filtering by type, status, date range"
        - "Create EventDetail.tsx with edit/delete/status lifecycle actions"
        - "Add routes: /events (list), /events/:id (detail)"
        - "Add navigation from calendar event click to detail view"
        - "Support dark mode styling consistent with existing components"
      acceptance_criteria:
        - "EventList.tsx and EventDetail.tsx exist (verified via: ls src/modules/planner/components/Event*.tsx | wc -l shows >= 4)"
        - "Routes include /events and /events/:id paths (verified via: grep -c 'events' src/modules/planner/routes.tsx shows >= 3)"
        - "EventDetail supports delete and status change (verified via: grep -E 'deleteEvent|completeEvent|skipEvent' src/modules/planner/components/EventDetail.tsx)"
        - "Build passes (verified via: pnpm run build exits 0)"
      blocked_by:
        - planner-001-event-create-form

    - id: planner-999-commit-verify
      title: "Commit and Verify CI"
      priority: P0
      estimate_hours: 0.5
      description: |
        Final sprint handoff - commit, push, verify CI, update goals.

        1. git status - review changes
        2. git add - stage files (avoid secrets)
        3. git commit - descriptive message
        4. git push - push to remote
        5. Verify CI passes (all checks green)
        6. Update goal progress in .claude/project.yaml

        DO NOT mark sprint complete until CI is green.
      acceptance_criteria:
        - "All changes committed (verified via: git status --porcelain shows clean)"
        - "Pushed to remote (verified via: git push exits 0)"
        - "Build passes (verified via: pnpm run build exits 0)"
        - "Tests pass (verified via: pnpm exec vitest run exits 0)"
        - "Goal progress updated (verified via: grep 'progress:' .claude/project.yaml)"
        - "All prior handoff acceptance criteria pass (verified via: /project:sprint-validate --acceptance exits with verdict PASS)"
      blocked_by:
        - planner-001-event-create-form
        - planner-002-event-list-detail

