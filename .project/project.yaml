  - id: goal-5
    title: "Security & CI Hardening"
    status: completed
    priority: 1
    progress: 100
    updated: 2026-03-07
    completed_date: 2026-03-07
    description: |
      Source: codebase review 2026-03-07, commit c036683, score 62/100 (D).
      Addresses: HIGH-1, MED-2, MED-3. Expected impact: Security 87->95, Deployability 80->90.
      Fix Gemini API key exposure in URL query params, add build verification to CI,
      and improve API key storage security.
    evidence: |
      Commit f2038f6. Gemini API key moved from ?key= query param to x-goog-api-key header
      (3 fetch calls). CI build step added. API keys encrypted at rest via AES-GCM 256-bit
      (Web Crypto API). All 906 tests pass, build clean.
    key_results:
      - "Gemini API key passed via header not URL query param"
      - "CI workflow runs build step before deploy"
      - "API keys encrypted at rest in IndexedDB"
    success_criteria:
      - id: sc-5-1
        description: "Gemini provider uses x-goog-api-key header instead of ?key= query param"
        completed: true
      - id: sc-5-2
        description: "GitHub Actions ci.yml includes npm run build step"
        completed: true
      - id: sc-5-3
        description: "API key storage uses Web Crypto API encryption"
        completed: true

  - id: goal-6
    title: "Performance — Bundle Splitting"
    status: completed
    priority: 2
    progress: 100
    updated: 2026-03-07
    completed_date: 2026-03-07
    description: |
      Source: codebase review 2026-03-07, commit c036683, score 62/100 (D).
      Addresses: MED-1. Expected impact: Performance 62->80.
      Split the 1.8MB main bundle using lazy imports for route modules
      and isolate heavy dependencies (react-big-calendar, markdown renderer).
    evidence: |
      Commit 275771c. Main chunk: 1,855 KB -> 411 KB (78% reduction). Route modules
      moved inside lazy boundaries using useRoutes(). react-big-calendar isolated to
      vendor-calendar chunk (183 KB). 906 tests pass, build clean.
    key_results:
      - "Main bundle under 500KB"
      - "Each module route uses lazy() imports"
      - "react-big-calendar in separate chunk"
    success_criteria:
      - id: sc-6-1
        description: "Route modules (grow, propagation, planner) use lazy() component imports"
        completed: true
      - id: sc-6-2
        description: "Main JS chunk under 500KB (down from 1.8MB)"
        completed: true
      - id: sc-6-3
        description: "react-big-calendar isolated via manualChunks or dynamic import"
        completed: true

