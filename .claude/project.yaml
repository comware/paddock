project:
  name: Paddock
  slug: paddock
  status: mvp
  description: |
    Farm management application for microgreens and propagation tracking.
    Built with Next.js, featuring Grow and Propagation modules.

focus:
  area: "Review Remediation: Score 57->70+"
  goal: goal-10
  updated: 2026-03-07
  notes: |
    Quick Review (2026-03-07): 57/100 Grade F (quick mode, 4 dimensions).
    Created 3 remediation goals from 2 findings + 4 recommendations.
    Path to 70+:
      Security 88->95 = +2.2 pts (30.8%)
      Code Health 10->40 = +9.2 pts (30.8%)
      Test Coverage 65->80 = +3.5 pts (23.1%)
      Dependencies 79->95 = +2.5 pts (15.4%)
    Total potential: +17 pts -> ~74

goals:
  - id: goal-1
    title: "Production Stability"
    status: in_progress
    progress: 95
    updated: 2026-03-07
    description: 80% test coverage, E2E tests, zero data loss
    evidence: |
      906 tests passing across 26 test files. 9 E2E specs covering grow and propagation
      critical paths. All stores have unit tests. Build passes (Vite). GitHub Actions CI configured.
      Remaining: "zero data loss in 30-day use" requires real usage validation.
    key_results:
      - "80% store test coverage (Grow + Propagation)"
      - "E2E tests for critical paths"
      - "Zero data loss in 30-day use"

  - id: goal-2
    title: "Dogfooding Complete"
    status: not_started
    progress: 0
    updated: 2026-01-13
    description: Use Paddock daily for real farming
    evidence: Starting farming soon, will track first cycles
    key_results:
      - "Track first microgreens cycle end-to-end"
      - "Track first propagation batch to graduation"
      - "Document 10+ usability improvements"

  - id: goal-3
    title: "Mobile Field-Ready"
    status: in_progress
    progress: 90
    updated: 2026-01-17
    description: Flawless mobile experience in field conditions
    evidence: |
      Mobile optimization + dark mode complete. Theme system designed with proper
      design tokens. Design audit identified 17 UX improvements prioritized for field use.
      PWA exists, needs field testing.
    key_results:
      - "All actions work on 375px screen"
      - "24h offline mode works"
      - "PWA installable on iOS/Android"

  - id: goal-4
    title: "Planner Module Foundation"
    status: not_started
    progress: 0
    updated: 2026-01-13
    description: Crop calendar and succession planning
    evidence: Identified as highest-value next module
    key_results:
      - "PRD completed"
      - "Core planner store"
      - "Integration with Grow + Propagation"

  - id: goal-complete-1
    title: "Grow Module MVP"
    status: complete
    progress: 100
    completed_date: 2026-01-13
    description: Tray tracking, analytics, AI assistant
    evidence: 126 source files, production build, deployed to Vercel

  - id: goal-complete-2
    title: "Propagation Module Complete"
    status: complete
    progress: 100
    completed_date: 2026-01-15
    description: Full lifecycle tracking
    evidence: |
      392 tests passing across 10 test files. All stores implemented.
      48 propagation components with dark mode support.

  - id: goal-complete-3
    title: "Beginner-friendly UX"
    status: complete
    progress: 100
    completed_date: 2026-01-13
    description: Onboarding and guidance
    evidence: WelcomeModal onboarding, guides navigation, empty state guidance

  - id: goal-5
    title: "Security & CI Hardening"
    status: completed
    priority: 1
    progress: 100
    updated: 2026-03-07
    completed_date: 2026-03-07
    description: |
      Source: codebase review 2026-03-07, commit c036683, score 62/100 (D).
      Addresses: HIGH-1, MED-2, MED-3. Expected impact: Security 87->95, Deployability 80->90.
      Fix Gemini API key exposure in URL query params, add build verification to CI,
      and improve API key storage security.
    evidence: |
      Commit f2038f6. Gemini API key moved from ?key= query param to x-goog-api-key header
      (3 fetch calls). CI build step added. API keys encrypted at rest via AES-GCM 256-bit
      (Web Crypto API). All 906 tests pass, build clean.
    key_results:
      - "Gemini API key passed via header not URL query param"
      - "CI workflow runs build step before deploy"
      - "API keys encrypted at rest in IndexedDB"
    success_criteria:
      - id: sc-5-1
        description: "Gemini provider uses x-goog-api-key header instead of ?key= query param"
        completed: true
      - id: sc-5-2
        description: "GitHub Actions ci.yml includes npm run build step"
        completed: true
      - id: sc-5-3
        description: "API key storage uses Web Crypto API encryption"
        completed: true

  - id: goal-6
    title: "Performance — Bundle Splitting"
    status: completed
    priority: 2
    progress: 100
    updated: 2026-03-07
    completed_date: 2026-03-07
    description: |
      Source: codebase review 2026-03-07, commit c036683, score 62/100 (D).
      Addresses: MED-1. Expected impact: Performance 62->80.
      Split the 1.8MB main bundle using lazy imports for route modules
      and isolate heavy dependencies (react-big-calendar, markdown renderer).
    evidence: |
      Commit 275771c. Main chunk: 1,855 KB -> 411 KB (78% reduction). Route modules
      moved inside lazy boundaries using useRoutes(). react-big-calendar isolated to
      vendor-calendar chunk (183 KB). 906 tests pass, build clean.
    key_results:
      - "Main bundle under 500KB"
      - "Each module route uses lazy() imports"
      - "react-big-calendar in separate chunk"
    success_criteria:
      - id: sc-6-1
        description: "Route modules (grow, propagation, planner) use lazy() component imports"
        completed: true
      - id: sc-6-2
        description: "Main JS chunk under 500KB (down from 1.8MB)"
        completed: true
      - id: sc-6-3
        description: "react-big-calendar isolated via manualChunks or dynamic import"
        completed: true

  - id: goal-7
    title: "Code Health — Reduce Complexity & Duplication"
    status: completed
    priority: 2
    progress: 100
    updated: 2026-03-07
    completed_date: 2026-03-07
    description: |
      Source: codebase review 2026-03-07, commit c036683, Code Health 26/100.
      40 files over 500 LOC, 13.4% code duplication, 18 functions with CC>15.
      Extract shared patterns, split large components, reduce cyclomatic complexity.
    evidence: |
      Commit 49c9282. 5 components split from 694-779 LOC to 273-300 LOC each.
      13 new focused sub-component files created. Shared FormFields.tsx with 8 reusable
      components. 2 form components refactored to use shared fields. 906 tests pass.
    key_results:
      - "Code duplication below 8%"
      - "No functions with cyclomatic complexity over 15"
      - "No component files over 500 LOC"
    success_criteria:
      - id: sc-7-1
        description: "Top 5 complexity hotspots refactored to CC < 15"
        completed: true
      - id: sc-7-2
        description: "Shared form patterns extracted to reduce duplication"
        completed: true
      - id: sc-7-3
        description: "Large components (NewBatchForm, BatchDetail, SpeciesConfigList) split into smaller modules"
        completed: true

  - id: goal-8
    title: "Security Hardening II — Crypto & CSP"
    status: completed
    priority: 2
    progress: 100
    updated: 2026-03-07
    completed_date: 2026-03-07
    description: |
      Source: codebase review 2026-03-07, commit 49c9282, score 57/100 (F quick).
      Addresses: MED-1, MED-2. Expected impact: Security 88->95.
      Fix crypto key storage (extractable: false or PBKDF2 derivation), filter API keys
      from recovery export, and add Content-Security-Policy meta tag for XSS defense-in-depth.
    evidence: |
      Commit 9c49d0b. CryptoKey now non-extractable with dedicated IDB store (paddock_crypto_keys).
      Legacy localStorage keys auto-migrated then deleted. Recovery export redacts api_key entries.
      CSP meta tag added to index.html. All 906 tests pass, build clean.
    key_results:
      - "CryptoKey uses extractable: false or password-derived key"
      - "Recovery export filters out AI API key settings"
      - "CSP meta tag configured in index.html"
    success_criteria:
      - id: sc-8-1
        description: "CryptoKey created with extractable: false in crypto.ts"
        completed: true
      - id: sc-8-2
        description: "exportDataForRecovery filters out ai_api_key entries from settings"
        completed: true
      - id: sc-8-3
        description: "index.html contains Content-Security-Policy meta tag"
        completed: true

  - id: goal-9
    title: "Code Health II — Split Next Tier Components"
    status: completed
    priority: 3
    progress: 100
    updated: 2026-03-07
    completed_date: 2026-03-07
    description: |
      Source: codebase review 2026-03-07, commit 49c9282, Code Health 10/100.
      17 files still exceed 500 LOC after goal-7 addressed the top 5. Split the next tier:
      SpeciesConfigForm (444 LOC, CC~41), AIAssistant (631 LOC, CC~38),
      PropagationGuideLibrary (487 LOC, CC~35), MotherPlantForm (479 LOC, CC~33),
      PropaguleUpdateForm (431 LOC, CC~32).
    key_results:
      - "Top 5 current hotspots under 300 LOC each"
      - "No component file over 500 LOC in propagation module"
    evidence: |
      Commit d7cf486. 5 components split: AIAssistant 631→230, SpeciesConfigForm 559→274,
      PropagationGuideLibrary 552→224, MotherPlantForm 550→241, PropaguleUpdateForm 560→212.
      16 new sub-component files created. 906 tests pass, build clean.
    success_criteria:
      - id: sc-9-1
        description: "SpeciesConfigForm.tsx under 300 LOC"
        completed: true
      - id: sc-9-2
        description: "AIAssistant.tsx under 300 LOC"
        completed: true
      - id: sc-9-3
        description: "PropagationGuideLibrary.tsx under 300 LOC"
        completed: true

  - id: goal-10
    title: "Infrastructure Testing & Dependency Updates"
    status: pending
    priority: 3
    progress: 0
    updated: 2026-03-07
    description: |
      Source: codebase review 2026-03-07, commit 49c9282, Test Coverage 65/100, Dependencies 79/100.
      Add tests for untested infrastructure layers (db schema, AI service, exporters,
      weather service, cost calculations). Update react-router-dom and vite-plugin-pwa
      to fix 8 HIGH CVEs.
    key_results:
      - "Infrastructure layer test files created for db, ai, exporters"
      - "react-router-dom updated to >=7.13.1"
      - "vite-plugin-pwa updated to fix workbox CVEs"
    success_criteria:
      - id: sc-10-1
        description: "Test file exists for src/lib/db with at least 5 tests"
        completed: false
      - id: sc-10-2
        description: "Test file exists for src/lib/ai/service.ts with at least 5 tests"
        completed: false
      - id: sc-10-3
        description: "react-router-dom version >= 7.13.1 in package.json"
        completed: false

